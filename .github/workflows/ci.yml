name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel duplicate runs of the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck • Lint • Validate content • Build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the shared packages first so downstream `tsc --noEmit` calls
      # have up-to-date types.
      - name: Build packages
        run: pnpm -r --filter "./packages/*" build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Validate lesson content
        run: pnpm --filter '@codecraft/content' validate

      - name: Format check
        run: pnpm format:check

      - name: Build web
        run: pnpm --filter '@codecraft/web' build

      - name: Build api
        run: pnpm --filter '@codecraft/api' build
